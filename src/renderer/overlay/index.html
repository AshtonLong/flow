<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'"
    />
    <title>Flow overlay</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="stage" data-phase="hidden" data-style="pill" data-size="medium">
      <!-- The same pill the marketing site shows: cloud, wave or dots or mark, then a label. -->
      <div id="pill" role="status" aria-live="polite">
        <svg id="cloud" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 9.5a4.25 4.25 0 0 1 .25 8.5z" />
        </svg>
        <canvas id="wave" width="69" height="21" aria-hidden="true"></canvas>
        <span id="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <svg id="ok" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
        <svg id="bang" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 6v7M12 17.5v.5" />
        </svg>
        <span id="label"></span>
        <svg id="lock" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z" />
        </svg>
        <span id="queued" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
