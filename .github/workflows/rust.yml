name: Rust

# Builds and tests the Rust port in flow-rs/.
on:
  push:
    paths: ['flow-rs/**', 'resources/**', 'tests/fixtures/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['flow-rs/**', 'resources/**', 'tests/fixtures/**', '.github/workflows/rust.yml']

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flow-rs
    steps:
      # resources/catalog.json is signed byte for byte; keep it as committed (LF).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flow-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p flow --bin Flow
