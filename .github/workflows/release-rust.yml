name: Release (Rust)

# Builds the Rust installer and its update feed (latest.yml). Run by hand from
# the Actions tab; with `upload` set, both files are attached to the draft
# release for the tag (created if missing). Publishing the draft is what makes
# installed copies update.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0 (must match flow-rs/Cargo.toml)
        required: true
      upload:
        description: Attach the installer to a draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flow-rs
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path flow-rs/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ inputs.tag }}") { throw "Tag ${{ inputs.tag }} does not match Cargo.toml version $version" }

      - name: Test
        working-directory: flow-rs
        run: cargo test --workspace

      - name: Build the installer
        shell: pwsh
        run: flow-rs/scripts/package.ps1

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem flow-rs/dist -Filter 'Flow-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced' }
          Write-Host "Installer: $($installer.Name), $([math]::Round($installer.Length / 1MB, 1)) MB"
          $env:FLOW_USER_DATA = Join-Path $env:RUNNER_TEMP 'flow-smoke'
          $stage = 'flow-rs/dist/stage'
          $p = Start-Process -FilePath "$stage/Flow.exe" -ArgumentList '--smoke-test','--hidden' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:FLOW_USER_DATA/logs/flow.log" -ErrorAction SilentlyContinue; throw "Smoke test failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: flow-installer
          path: |
            flow-rs/dist/Flow-Setup-*.exe
            flow-rs/dist/latest.yml

      - name: Attach to a draft release
        if: ${{ inputs.upload }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ inputs.tag }} 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create ${{ inputs.tag }} --draft --title ("${{ inputs.tag }}" -replace '^v', '') }
          gh release upload ${{ inputs.tag }} (Get-ChildItem flow-rs/dist/Flow-Setup-*.exe).FullName flow-rs/dist/latest.yml --clobber
