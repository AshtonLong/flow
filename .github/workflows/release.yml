name: Release

# Pushing a tag `vX.Y.Z` builds the Rust app's installer (flow-rs/) and its
# update feed (latest.yml), tests both, and publishes them as the GitHub
# Release for the tag. Installed copies (Rust or Electron) update from the
# latest release's latest.yml. Nothing is published unless every step passes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # resources/catalog.json is signed byte for byte; keep it as committed (LF).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flow-rs
      # stage-engine.ps1 fetches the prebuilt speech engine with npm pack.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path flow-rs/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }

      - name: Test
        working-directory: flow-rs
        run: cargo test --workspace

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: flow-rs/scripts/package.ps1

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem flow-rs/dist -Filter 'Flow-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced' }
          Write-Host "Installer: $($installer.Name), $([math]::Round($installer.Length / 1MB, 1)) MB"
          $env:FLOW_USER_DATA = Join-Path $env:RUNNER_TEMP 'flow-smoke'
          $p = Start-Process -FilePath 'flow-rs/dist/stage/Flow.exe' -ArgumentList '--smoke-test','--hidden' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:FLOW_USER_DATA/logs/flow.log" -ErrorAction SilentlyContinue; throw "Smoke test failed ($($p.ExitCode))" }

      # Installs, starts and uninstalls a copy of the installer (its own
      # uninstall key and shortcut). The runner has no speech model, so it skips dictation.
      - name: Test the installer
        shell: pwsh
        run: flow-rs/scripts/test-installer.ps1 -SkipBuild -SkipDictation

      - uses: actions/upload-artifact@v4
        with:
          name: flow-windows-${{ github.ref_name }}
          path: |
            flow-rs/dist/Flow-Setup-*.exe
            flow-rs/dist/latest.yml

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem flow-rs/dist -Filter "Flow-Setup-$($tag -replace '^v', '').exe"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --title ($tag -replace '^v', '') --generate-notes }
          gh release upload $tag $installer.FullName flow-rs/dist/latest.yml --clobber
          gh release edit $tag --draft=false --latest
