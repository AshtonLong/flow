[package]
name = "flow-store"
description = "Flow's stored data: the model manager and downloads, transcript history and encrypted API keys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flow-core = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem"]

[dev-dependencies]
tempfile = { workspace = true }
