[package]
name = "flow-store"
description = "Flow's stored data: the model manager and downloads, transcript history and encrypted API keys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flow-core = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: `installed.json` stores file times as fractional milliseconds and
# they are compared for equality, so they must parse back to the exact same f64.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem"]

[dev-dependencies]
tempfile = { workspace = true }
ed25519-dalek = { workspace = true }
# The tests serve model files and catalogs over real HTTPS from a local server.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
