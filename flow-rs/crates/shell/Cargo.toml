[package]
name = "flow-shell"
description = "Flow's desktop surfaces: the overlay pill, the tray icon and the start and stop sounds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flow-core = { workspace = true }
flow-audio = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
tiny-skia = { workspace = true }
ttf-parser = { workspace = true }
png = { workspace = true }
# Text shaping (kerning) for the pill label, as Chromium's HarfBuzz does. Already in the
# workspace through egui, so it adds no new package.
harfrust = "0.12"

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
